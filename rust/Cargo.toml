[package]
name = "skyrim-remember-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bincode = "1.3.3"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
